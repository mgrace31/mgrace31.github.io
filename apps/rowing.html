<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rowing Progress</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <div id="rowing-widget" class="widget">
    <h2>Monthly Rowing Progress</h2>
    <div id="progress-bar-container" class="progress-bar-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <div class="progress-text" id="progress-text">Loading...</div>
  </div>

  <script>
    (async () => {
      const GOAL = 100000;
      const CHECKPOINTS = [33000, 66000, 100000];
      const TICK_INTERVAL = 10000;

      // Get current month name
      const now = new Date();
      const monthName = now.toLocaleString('default', { month: 'long' });
      const widgetTitle = document.querySelector('#rowing-widget h2');
      if (widgetTitle) {
          widgetTitle.textContent = `${monthName} Rowing`;
      }

      try {
        const response = await fetch('https://firefox-homepage.onrender.com/rowing_data');
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

        const data = await response.json();
        const metersThisMonth = data.metersThisMonth || 0;

        // Progress bar
        const progressBar = document.getElementById('progress-bar');
        if (progressBar) {
          progressBar.style.width = Math.min(100, (metersThisMonth / GOAL) * 100) + '%';
        }

        // Draw ticks
        const container = document.getElementById('progress-bar-container');
        if (container) {
          container.querySelectorAll('.tick').forEach(t => t.remove());

          for (let tick = TICK_INTERVAL; tick < GOAL; tick += TICK_INTERVAL) {
            const tickEl = document.createElement('div');
            tickEl.className = 'tick';
            tickEl.style.left = (tick / GOAL * 100) + '%';
            container.appendChild(tickEl);
          }
        }

        // Checkpoints
        CHECKPOINTS.forEach((cp, index) => {
          const el = document.getElementById(`cp${index+1}`);
          if (el && metersThisMonth >= cp) el.classList.add('completed');
        });

        // Progress text
        const progressTextEl = document.getElementById('progress-text');
        if (progressTextEl) {
          progressTextEl.textContent = `${metersThisMonth.toLocaleString()} meters rowed this month`;
        }

      } catch (e) {
        console.error('Error fetching or displaying rowing data:', e);
        const progressTextEl = document.getElementById('progress-text');
        if (progressTextEl) progressTextEl.textContent = "Could not load rowing data.";
      }
    })();
  </script>
</body>
</html>
